<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 175" width="100%" role="img" aria-label="End-to-End Celebration Website Workflow">
  <defs>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E6D5A8"/>
      <stop offset="50%" stop-color="#C5A15A"/>
      <stop offset="100%" stop-color="#E6D5A8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="175" rx="18" fill="#F8F7F4" stroke="#EAE6DD"/>

  <!-- Connecting Gold Track -->
  <line x1="120" y1="70" x2="1080" y2="70" stroke="url(#trackGrad)" stroke-width="2.5"/>

  <!-- Animated Travelling Pulse -->
  <circle cy="70" r="5" fill="#C5A15A">
    <animate attributeName="cx" values="120;1080;120" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- 5 Milestones -->
  <g font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <!-- Step 1 -->
    <rect x="40" y="34" width="180" height="108" rx="14" fill="#FFFFFF" stroke="#E6D5A8"/>
    <circle cx="130" cy="64" r="14" fill="#C5A15A"/>
    <text x="130" y="68" font-size="11" font-weight="700" fill="#FFFFFF">01</text>
    <text x="130" y="98" font-size="13" font-weight="700" fill="#202020">Moments Studio</text>
    <text x="130" y="118" font-size="10.5" fill="#777777">Customize &amp; Upload Media</text>

    <!-- Step 2 -->
    <rect x="275" y="34" width="180" height="108" rx="14" fill="#FFFFFF" stroke="#E6D5A8"/>
    <circle cx="365" cy="64" r="14" fill="#C5A15A"/>
    <text x="365" y="68" font-size="11" font-weight="700" fill="#FFFFFF">02</text>
    <text x="365" y="98" font-size="13" font-weight="700" fill="#202020">50% Advance</text>
    <text x="365" y="118" font-size="10.5" fill="#777777">Razorpay / Verified UPI</text>

    <!-- Step 3 -->
    <rect x="510" y="34" width="180" height="108" rx="14" fill="#FFFFFF" stroke="#E6D5A8"/>
    <circle cx="600" cy="64" r="14" fill="#C5A15A"/>
    <text x="600" y="68" font-size="11" font-weight="700" fill="#FFFFFF">03</text>
    <text x="600" y="98" font-size="13" font-weight="700" fill="#202020">Preview &amp; Revisions</text>
    <text x="600" y="118" font-size="10.5" fill="#777777">Unlimited Refinements</text>

    <!-- Step 4 -->
    <rect x="745" y="34" width="180" height="108" rx="14" fill="#FFFFFF" stroke="#E6D5A8"/>
    <circle cx="835" cy="64" r="14" fill="#C5A15A"/>
    <text x="835" y="68" font-size="11" font-weight="700" fill="#FFFFFF">04</text>
    <text x="835" y="98" font-size="13" font-weight="700" fill="#202020">50% Balance</text>
    <text x="835" y="118" font-size="10.5" fill="#777777">PDF Invoice &amp; Approval</text>

    <!-- Step 5 -->
    <rect x="980" y="34" width="180" height="108" rx="14" fill="#FFFFFF" stroke="#C5A15A" stroke-width="1.5"/>
    <circle cx="1070" cy="64" r="14" fill="#202020"/>
    <text x="1070" y="68" font-size="11" font-weight="700" fill="#E6D5A8">05</text>
    <text x="1070" y="98" font-size="13" font-weight="700" fill="#202020">Live Celebration</text>
    <text x="1070" y="118" font-size="10.5" fill="#A4823D">QR Code, RSVP &amp; Wishes</text>
  </g>
</svg>
