<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-label="LB Digital Creations — Creating Websites for Your Special Moments">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8F7F4"/>
      <stop offset="100%" stop-color="#F3EDE0"/>
    </linearGradient>

    <linearGradient id="goldShimmer" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#A4823D"/>
      <stop offset="35%" stop-color="#C5A15A"/>
      <stop offset="50%" stop-color="#F6E6B4"/>
      <stop offset="65%" stop-color="#C5A15A"/>
      <stop offset="100%" stop-color="#A4823D"/>
      <animate attributeName="x1" values="-100%;100%;-100%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%;0%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="borderGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E6D5A8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#C5A15A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E6D5A8" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E6D5A8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Luxury Ivory Card -->
  <rect width="1200" height="340" rx="22" fill="url(#bgGrad)"/>
  <ellipse cx="600" cy="170" rx="460" ry="130" fill="url(#ambientGlow)">
    <animate attributeName="rx" values="430;490;430" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Double Filigree Frame -->
  <rect x="14" y="14" width="1172" height="312" rx="16" fill="none" stroke="url(#borderGold)" stroke-width="1.5"/>
  <rect x="24" y="24" width="1152" height="292" rx="12" fill="none" stroke="#EAE6DD" stroke-width="1"/>

  <!-- Animated Sparkle Particles -->
  <g fill="#C5A15A">
    <circle cx="140" cy="90" r="2.2" opacity="0.2">
      <animate attributeName="cy" values="105;75;105" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.85;0.15" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="245" r="1.8" opacity="0.2">
      <animate attributeName="cy" values="255;225;255" dur="6.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.75;0.1" dur="6.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="85" r="2.4" opacity="0.2">
      <animate attributeName="cy" values="98;68;98" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1055" cy="240" r="1.9" opacity="0.2">
      <animate attributeName="cy" values="252;222;252" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.8;0.15" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <polygon points="180,165 183,172 190,175 183,178 180,185 177,178 170,175 177,172" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.95;0.2" dur="4.2s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="1020,160 1023,167 1030,170 1023,173 1020,180 1017,173 1010,170 1017,167" opacity="0.3">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.2s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Crown Crest Badge -->
  <g transform="translate(600, 74)">
    <rect x="-145" y="-16" width="290" height="30" rx="15" fill="#FFFFFF" stroke="#E6D5A8" stroke-width="1.2"/>
    <text x="0" y="3" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3.5" fill="#A4823D">
      BESPOKE DIGITAL CELEBRATION SAAS
    </text>
  </g>

  <!-- Shimmering Gold Title -->
  <text x="600" y="158" text-anchor="middle" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" letter-spacing="2" fill="url(#goldShimmer)">
    LB DIGITAL CREATIONS
  </text>

  <!-- Animated Sweeping Underline -->
  <line x1="360" y1="184" x2="840" y2="184" stroke="#E6D5A8" stroke-width="1.5"/>
  <line x1="460" y1="184" x2="740" y2="184" stroke="#C5A15A" stroke-width="2.5">
    <animate attributeName="x1" values="590;360;590" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="610;840;610" dur="5s" repeatCount="indefinite"/>
  </line>

  <!-- Tagline -->
  <text x="600" y="222" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="22" fill="#202020">
    Creating Websites for Your Special Moments
  </text>

  <!-- Ecosystem Pills -->
  <g font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#555555" text-anchor="middle">
    <rect x="215" y="254" width="145" height="32" rx="16" fill="#FFFFFF" stroke="#EAE6DD"/>
    <text x="287" y="274">Customer Web &amp; PWA</text>

    <rect x="378" y="254" width="135" height="32" rx="16" fill="#FFFFFF" stroke="#EAE6DD"/>
    <text x="445" y="274">Moments Studio</text>

    <rect x="531" y="254" width="138" height="32" rx="16" fill="#FFFFFF" stroke="#EAE6DD"/>
    <text x="600" y="274">NestJS + Prisma</text>

    <rect x="687" y="254" width="135" height="32" rx="16" fill="#FFFFFF" stroke="#EAE6DD"/>
    <text x="754" y="274">Admin Portal</text>

    <rect x="840" y="254" width="145" height="32" rx="16" fill="#FFFFFF" stroke="#EAE6DD"/>
    <text x="912" y="274">Expo iOS &amp; Android</text>
  </g>
</svg>
